<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>¡Gracias por suscribirte! · Wilkyjams Dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            background: var(--bg-color);
            position: relative;
            overflow: hidden;
        }
        .thanks-panel {
            padding: 60px 40px;
            max-width: 600px;
            width: 90%;
            z-index: 10;
        }
        .thanks-icon {
            font-size: 4rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .thanks-panel h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .thanks-panel p {
            color: var(--text-muted);
            margin-bottom: 32px;
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <div class="glass-panel thanks-panel">
        <i class="fas fa-check-circle thanks-icon"></i>
        <h1>¡Gracias!</h1>
        <p>Tu suscripción se ha realizado correctamente. Pronto recibirás contenido exclusivo en tu correo.</p>
        <a href="index.html" class="btn-primary">
            <i class="fas fa-home"></i> Volver al inicio
        </a>
    </div>

    <!-- LIBRERÍAS 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Fondo 3D igual al de tu sitio
        const canvas = document.querySelector('#webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 400;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 18;
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({ size: 0.03, color: 0xa8b9cc, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particlesMesh);

        const sphere = new THREE.Mesh(new THREE.IcosahedronGeometry(1.8, 1), new THREE.MeshBasicMaterial({ color: 0xa8b9cc, wireframe: true, transparent: true, opacity: 0.15 }));
        sphere.position.set(2.5, 0, -2);
        scene.add(sphere);

        const sphere2 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 1), new THREE.MeshBasicMaterial({ color: 0xc4a8cc, wireframe: true, transparent: true, opacity: 0.1 }));
        sphere2.position.set(-2.5, -1, -2);
        scene.add(sphere2);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            particlesMesh.rotation.y = t * 0.04;
            sphere.rotation.y = t * 0.12;
            sphere2.rotation.y = -t * 0.15;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
