<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artículo · Wilkyjams Dev Blog</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <!-- CSS PRINCIPAL -->
    <link rel="stylesheet" href="../style.css" />

    <style>
        /* Estilos específicos para el artículo */
        .article-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 140px 20px 80px;
            position: relative;
            z-index: 10;
        }

        .article-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 30px;
            transition: color 0.3s ease;
        }
        .article-back-btn:hover { color: var(--accent-1); }

        .article-header {
            margin-bottom: 40px;
        }

        .article-category {
            display: inline-block;
            background: rgba(168, 185, 204, 0.1);
            color: var(--accent-1);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border: 1px solid rgba(168, 185, 204, 0.2);
        }

        .article-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            line-height: 1.1;
            color: #fff;
            margin-bottom: 20px;
        }

        .article-meta {
            display: flex;
            gap: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .article-image {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            border-radius: var(--radius);
            margin-bottom: 40px;
            border: 1px solid var(--glass-border);
        }

        .article-body p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .article-body h2 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: #fff;
            margin: 40px 0 20px;
        }

        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid var(--glass-border);
        }
        .article-tags span {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: var(--accent-1);
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <!-- NAVEGACIÓN SIMPLE -->
    <nav>
        <div class="container">
            <a href="../index.html" class="logo" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
                <span class="logo-icon">JP</span>
                <span class="logo-text">Wilkyjams Dev</span>
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="../index.html#services">Servicios</a></li>
                <li><a href="../index.html#store">Tienda</a></li>
                <li><a href="index.html" style="color: var(--accent-2); font-weight: 700;">Blog</a></li>
                <li><a href="../index.html#contact" class="btn-outline">Contáctame</a></li>
            </ul>
        </div>
    </nav>

    <!-- CONTENIDO DEL ARTÍCULO -->
    <main class="article-container">
        <a href="index.html" class="article-back-btn">
            <i class="fas fa-arrow-left"></i> Volver al blog
        </a>

        <div id="articleContent">
            <p style="text-align: center; color: var(--text-muted);">Cargando artículo...</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 <span style="background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Jamsle Porcena</span> · Diseño web & Marketing Digital</p>
            </div>
        </div>
    </footer>

    <!-- FONDO 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.querySelector('#webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 400;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 18;
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({ size: 0.03, color: 0xa8b9cc, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particlesMesh);

        const sphere = new THREE.Mesh(new THREE.IcosahedronGeometry(1.8, 1), new THREE.MeshBasicMaterial({ color: 0xa8b9cc, wireframe: true, transparent: true, opacity: 0.15 }));
        sphere.position.set(2.5, 0, -2);
        scene.add(sphere);

        let reqId;
        const clock = new THREE.Clock();
        function animate() {
            reqId = requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            particlesMesh.rotation.y = t * 0.04;
            sphere.rotation.y = t * 0.12;
            renderer.render(scene, camera);
        }
        animate();
    </script>

    <!-- SCRIPT PARA CARGAR EL ARTÍCULO SEGÚN EL SLUG -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');
            const container = document.getElementById('articleContent');

            if (!slug) {
                container.innerHTML = '<p style="text-align:center; color: #ef4444;">No se especificó ningún artículo.</p>';
                return;
            }

            try {
                const response = await fetch('blog.json');
                const posts = await response.json();
                const post = posts.find(p => p.slug === slug);

                if (!post) {
                    container.innerHTML = '<p style="text-align:center; color: #ef4444;">Artículo no encontrado.</p>';
                    return;
                }

                document.title = post.title + ' · Wilkyjams Dev';

                container.innerHTML = `
                    <header class="article-header">
                        <span class="article-category">${post.category}</span>
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">
                            <span><i class="fas fa-calendar"></i> ${new Date(post.date).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
                            <span><i class="fas fa-clock"></i> ${post.readTime} de lectura</span>
                        </div>
                    </header>
                    <img src="${post.image}" alt="${post.title}" class="article-image">
                    <div class="article-body">
                        ${post.body.map(paragraph => `<p>${paragraph}</p>`).join('')}
                    </div>
                    <div class="article-tags">
                        ${post.tags.map(tag => `<span>#${tag}</span>`).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = '<p style="text-align:center; color: #ef4444;">Error al cargar el artículo.</p>';
            }
        });
    </script>
</body>
</html>
