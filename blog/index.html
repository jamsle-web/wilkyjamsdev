<body>

    <!-- NAVEGACIÓN -->
    <nav>

            <a href="../index.html" class="logo" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
                <span class="logo-icon">JP</span>
                <span class="logo-text">Wilkyjams Dev</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="../index.html#services">Servicios</a></li>
                <li><a href="../index.html#store">Tienda</a></li>
                <li><a href="index.html" style="color: var(--accent-2); font-weight: 700;">Blog</a></li>
                <li><a href="https://jamsle-porcena-portafolio.vercel.app/" target="_blank">Portafolio <i class="fas fa-external-link-alt" style="font-size: 0.8em;"></i></a></li>
                <li><a href="../index.html#contact" class="btn-outline">Contáctame</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO DEL BLOG -->
    <section style="padding-top: 160px; min-height: auto;">
        <div class="container">
            <div class="section-header" data-aos="fade-up">
                <span class="label glass-label">Recursos & Ideas</span>
                <h2>El Blog de <span class="highlight">Wilkyjams</span></h2>
                <p>Artículos sobre diseño web, UI/UX, marketing digital e inteligencia artificial.</p>
            </div>
        </div>
    </section>

    <!-- BOTONES DE FILTRO -->
    <section style="padding: 0 0 20px 0;">
        <div class="container">
            <div class="filter-tabs" id="blogFilterTabs"></div>

    </section>

    <!-- AQUÍ SE CARGARÁN LOS ARTÍCULOS -->
    <section style="min-height: 50vh; padding: 20px 0 100px 0;">
        <div class="container">
            <div class="store-grid" id="blogGrid">
                <p style="text-align: center; color: var(--text-muted);">Cargando artículos...</p>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 <span style="background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Jamsle Porcena</span> · Diseño web & Marketing Digital</p>
            </div>
        </div>
    </footer>

    <!-- SCRIPT PARA EL FONDO 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.querySelector('#webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 400;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 18;
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({ size: 0.03, color: 0xa8b9cc, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particlesMesh);

        const sphere = new THREE.Mesh(new THREE.IcosahedronGeometry(1.8, 1), new THREE.MeshBasicMaterial({ color: 0xa8b9cc, wireframe: true, transparent: true, opacity: 0.15 }));
        sphere.position.set(2.5, 0, -2);
        scene.add(sphere);

        let reqId;
        const clock = new THREE.Clock();
        function animate() {
            reqId = requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            particlesMesh.rotation.y = t * 0.04;
            sphere.rotation.y = t * 0.12;
            renderer.render(scene, camera);
        }
        animate();
    </script>

    <!-- SCRIPT PARA CARGAR LOS ARTÍCULOS Y FILTRARLOS -->
    <script>
        let allPosts = [];
        let currentCategory = 'all';

        function renderBlogPosts(posts) {
            const grid = document.getElementById('blogGrid');
            if (!grid) return;

            const filtered = currentCategory === 'all' 
                ? posts 
                : posts.filter(p => p.category === currentCategory);

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: var(--text-muted); grid-column: 1 / -1;">No hay artículos en esta categoría.</p>';
                return;
            }

            grid.innerHTML = filtered.map(post => `
                <div class="store-card" data-aos="fade-up">
                    <div class="store-thumb">
                        <span class="store-cat">${post.category}</span>
                        <img src="${post.image}" alt="${post.title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=500&q=80'">
                    </div>
                    <div class="store-body">
                        <div style="display: flex; gap: 8px; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px;">
                            <span><i class="fas fa-calendar"></i> ${new Date(post.date).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                            <span>·</span>
                            <span><i class="fas fa-clock"></i> ${post.readTime}</span>
                        </div>
                        <h3>${post.title}</h3>
                        <p>${post.excerpt}</p>
                        <div class="store-footer">
                            <div class="store-price" style="font-size: 0.8rem; color: var(--accent-1);">
                                ${post.tags.map(t => `#${t}`).join(' ')}
                            </div>
                            <div class="store-card-actions">
                                <a href="blog-post.html?slug=${post.slug}" class="btn-add-cart" style="text-decoration: none;">
                                    <i class="fas fa-book-open"></i> Leer más
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderCategoryFilters(posts) {
            const tabs = document.getElementById('blogFilterTabs');
            if (!tabs) return;

            const categories = ['all', ...new Set(posts.map(p => p.category))];
            
            tabs.innerHTML = categories.map(cat => `
                <button 
                    class="${cat === currentCategory ? 'active' : ''}" 
                    data-category="${cat}"
                >
                    ${cat === 'all' ? 'Todos' : cat}
                </button>
            `).join('');

            tabs.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentCategory = btn.dataset.category;
                    tabs.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderBlogPosts(allPosts);
                });
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('blog.json');
                allPosts = await response.json();
                
                renderCategoryFilters(allPosts);
                renderBlogPosts(allPosts);
            } catch (error) {
                console.error('Error cargando el blog:', error);
                document.getElementById('blogGrid').innerHTML = '<p style="text-align: center; color: var(--text-muted);">No se pudieron cargar los artículos.</p>';
            }
        });
    </script>
</body>
</html>
