<!-- BOTONES DE FILTRO (Agregar antes del grid del blog) -->
<div class="filter-tabs" id="blogFilterTabs" style="margin-bottom: 40px;"></div>

<!-- SCRIPT PARA CARGAR LOS ARTÍCULOS Y FILTRARLOS -->
<script>
    let allPosts = [];
    let currentCategory = 'all';

    // Renderizar las tarjetas del blog
    function renderBlogPosts(posts) {
        const grid = document.getElementById('blogGrid');
        if (!grid) return;

        const filtered = currentCategory === 'all' 
            ? posts 
            : posts.filter(p => p.category === currentCategory);

        if (filtered.length === 0) {
            grid.innerHTML = '<p style="text-align: center; color: var(--text-muted); grid-column: 1 / -1;">No hay artículos en esta categoría.</p>';
            return;
        }

        grid.innerHTML = filtered.map(post => `
            <div class="store-card" data-aos="fade-up">
                <div class="store-thumb">
                    <span class="store-cat">${post.category}</span>
                    <img src="${post.image}" alt="${post.title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=500&q=80'">
                </div>
                <div class="store-body">
                    <div style="display: flex; gap: 8px; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px;">
                        <span><i class="fas fa-calendar"></i> ${new Date(post.date).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                        <span>·</span>
                        <span><i class="fas fa-clock"></i> ${post.readTime}</span>
                    </div>
                    <h3>${post.title}</h3>
                    <p>${post.excerpt}</p>
                    <div class="store-footer">
                        <div class="store-price" style="font-size: 0.8rem; color: var(--accent-1);">
                            ${post.tags.map(t => `#${t}`).join(' ')}
                        </div>
                        <div class="store-card-actions">
                            <a href="blog-post.html?slug=${post.slug}" class="btn-add-cart" style="text-decoration: none;">
                                <i class="fas fa-book-open"></i> Leer más
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // Generar los botones de filtro dinámicamente
    function renderCategoryFilters(posts) {
        const tabs = document.getElementById('blogFilterTabs');
        if (!tabs) return;

        const categories = ['all', ...new Set(posts.map(p => p.category))];
        
        tabs.innerHTML = categories.map(cat => `
            <button 
                class="${cat === currentCategory ? 'active' : ''}" 
                data-category="${cat}"
            >
                ${cat === 'all' ? 'Todos' : cat}
            </button>
        `).join('');

        tabs.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                currentCategory = btn.dataset.category;
                tabs.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderBlogPosts(allPosts);
            });
        });
    }

    // Cargar los artículos desde el JSON
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('blog.json');
            allPosts = await response.json();
            
            renderCategoryFilters(allPosts);
            renderBlogPosts(allPosts);
        } catch (error) {
            console.error('Error cargando el blog:', error);
            document.getElementById('blogGrid').innerHTML = '<p style="text-align: center; color: var(--text-muted);">No se pudieron cargar los artículos.</p>';
        }
    });
</script>
