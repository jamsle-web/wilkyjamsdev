<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wilkyjams Dev · Admin Login</title>
    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../style.css" />
</head>
<body>

    <div class="admin-login-wrapper">
        <div class="admin-card">
            <a href="../index.html" class="back-to-site"><i class="fas fa-arrow-left"></i> Volver al sitio</a>
            <div class="admin-logo">JP · Admin</div>
            <p class="admin-subtitle">Panel de administración de JamsLab Studio</p>

            <div class="admin-error" id="loginError" role="alert"></div>

            <form id="loginForm">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="Tu correo" autocomplete="email" inputmode="email" required />

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" required />

                <button type="submit"><i class="fas fa-right-to-bracket" style="margin-right: 8px;"></i> Iniciar sesión</button>
            </form></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-client.js"></script>
    <script>
      const form = document.getElementById('loginForm');
      const errorBox = document.getElementById('loginError');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.remove('show');
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const { data, error } = await portfolioSupabase.auth.signInWithPassword({ email, password });
        if (error) { console.error('Supabase login error', { message: error?.message, status: error?.status, code: error?.code }); errorBox.textContent = error?.message || 'No se pudo iniciar sesión. Verifica tus datos.'; errorBox.classList.add('show'); return; }
        if (data.user?.app_metadata?.role !== 'admin') {
          await portfolioSupabase.auth.signOut();
          errorBox.textContent = 'Esta cuenta no tiene permisos de administrador.';
          errorBox.classList.add('show');
          return;
        }
        location.href = 'dashboard.html';
      });
    </script>
</body>
</html>
