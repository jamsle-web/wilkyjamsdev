<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wilkyjams Dev · Admin Login</title>
    <meta name="robots" content="noindex, nofollow" />

    <!-- FAVICON -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <!-- CSS del Admin -->
    <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #050505;">

    <div class="admin-login-wrapper" style="width: 100%; max-width: 400px; padding: 20px;">
        <div class="admin-card" style="background: #0f0f13; border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); position: relative; text-align: center;">
            
            <a href="../index.html" style="position: absolute; top: 20px; left: 20px; color: #888; text-decoration: none; font-size: 0.85rem; transition: 0.3s;">
                <i class="fas fa-arrow-left"></i> Volver al sitio
            </a>

            <div style="font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 10px;">
                JP · Admin
            </div>
            <p style="color: #888; font-size: 0.9rem; margin-bottom: 30px;">Panel de administración de JamsLab Studio</p>

            <div id="loginError" style="display: none; background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; border: 1px solid rgba(239, 68, 68, 0.2);"></div>

            <form id="loginForm">
                <label style="display: block; text-align: left; font-size: 0.85rem; color: #888; margin-bottom: 8px;">Correo electrónico</label>
                <input type="email" id="email" placeholder="Tu correo" autocomplete="email" required style="width: 100%; padding: 14px 16px; margin-bottom: 20px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #fff; font-size: 1rem; outline: none; transition: 0.3s;" />

                <label style="display: block; text-align: left; font-size: 0.85rem; color: #888; margin-bottom: 8px;">Contraseña</label>
                <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" required style="width: 100%; padding: 14px 16px; margin-bottom: 20px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #fff; font-size: 1rem; outline: none; transition: 0.3s;" />

                <button type="submit" style="width: 100%; padding: 16px; border-radius: 12px; border: none; background: #fff; color: #000; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s;">
                    <i class="fas fa-right-to-bracket" style="margin-right: 8px;"></i> Iniciar sesión
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-client.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('loginError');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { data, error } = await portfolioSupabase.auth.signInWithPassword({ email, password });

            if (error) {
                console.error('Supabase login error', { message: error?.message, status: error?.status, code: error?.code });
                errorBox.textContent = error?.message || 'No se pudo iniciar sesión. Verifica tus datos.';
                errorBox.style.display = 'block';
                return;
            }

            if (data.user?.app_metadata?.role !== 'admin') {
                await portfolioSupabase.auth.signOut();
                errorBox.textContent = 'Esta cuenta no tiene permisos de administrador.';
                errorBox.style.display = 'block';
                return;
            }

            location.href = 'dashboard.html';
        });
    </script>
    <!-- Vercel Web Analytics -->
    <script defer src="https://vercel-insights.com/v1/script.js"></script>
</body>
</html>
