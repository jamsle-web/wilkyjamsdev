<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wilkyjams Dev · Admin</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

    <aside class="sidebar">
        <div class="logo">JP · Admin</div>
        <nav class="nav" id="adminNav">
            <a data-section="summary" class="active"><i class="fas fa-chart-pie"></i> Resumen</a>
            <a data-section="vip"><i class="fas fa-crown"></i> Club VIP</a>
            <a data-section="products"><i class="fas fa-box"></i> Tienda</a>
            <a data-section="orders"><i class="fas fa-receipt"></i> Pedidos</a>
            <a data-section="messages"><i class="fas fa-envelope"></i> Mensajes</a>
        </nav>
        <button class="logout" onclick="logoutAdmin()"><i class="fas fa-right-from-bracket"></i> Salir</button>
    </aside>

    <main class="main">
        <div class="topbar">
            <h1 id="pageTitle">Resumen</h1>
            <a href="/" target="_blank" style="color: #fff; text-decoration: none;"><i class="fas fa-external-link-alt"></i> Ver Sitio</a>
        </div>

        <!-- VISTA: RESUMEN -->
        <div class="panel" id="view-summary">
            <h3>Bienvenido al panel</h3>
            <p style="color: #888; margin-top: 10px;">Selecciona una opción del menú izquierdo para gestionar tu sitio.</p>
        </div>

        <!-- VISTA: CLUB VIP -->
        <div class="panel" id="view-vip" hidden>
            <div class="panel-header">
                <h3>Agregar Recurso al Club VIP</h3>
            </div>
            <form id="vipForm">
                <div class="form-group"><label>Título</label><input name="title" required></div>
                <div class="form-group"><label>Descripción</label><textarea name="description" rows="2" required></textarea></div>
                <div class="form-group"><label>URL de la Imagen (Opcional)</label><input name="image_url" type="url"></div>
                <div class="form-group">
                    <label>Tipo</label>
                    <select name="type">
                        <option value="free">Gratis</option>
                        <option value="vip">VIP</option>
                    </select>
                </div>
                <div class="form-group"><label>Código HTML</label><textarea name="code_content" rows="4"></textarea></div>
                <div class="form-group"><label>Código CSS</label><textarea name="code_css" rows="4"></textarea></div>
                <div class="form-group"><label>Código JS</label><textarea name="code_js" rows="4"></textarea></div>
                <button type="submit" class="btn-add">Guardar Recurso</button>
            </form>
        </div>

        <!-- VISTA: TIENDA -->
        <div class="panel" id="view-products" hidden>
            <div class="panel-header"><h3>Productos de la Tienda</h3></div>
            <table><thead><tr><th>Producto</th><th>Precio</th></tr></thead><tbody id="productsTableBody"></tbody></table>
        </div>

        <!-- VISTA: PEDIDOS -->
        <div class="panel" id="view-orders" hidden>
            <div class="panel-header"><h3>Pedidos Recientes</h3></div>
            <table><thead><tr><th>Cliente</th><th>Total</th></tr></thead><tbody id="ordersTableBody"></tbody></table>
        </div>

        <!-- VISTA: MENSAJES -->
        <div class="panel" id="view-messages" hidden>
            <div class="panel-header"><h3>Mensajes de Contacto</h3></div>
            <table><thead><tr><th>Nombre</th><th>Asunto</th></tr></thead><tbody id="messagesTableBody"></tbody></table>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-client.js"></script>
    <script>
        const db = window.portfolioSupabase;

        // NAVEGACIÓN
        document.querySelectorAll('.nav a').forEach(link => {
            link.addEventListener('click', () => {
                // Ocultar todo
                document.querySelectorAll('.panel').forEach(p => p.hidden = true);
                document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
                
                // Mostrar seleccionado
                const section = link.dataset.section;
                document.getElementById('view-' + section).hidden = false;
                link.classList.add('active');
                document.getElementById('pageTitle').textContent = link.textContent.trim();

                // Cargar datos si es necesario
                if(section === 'products') loadProducts();
                if(section === 'orders') loadOrders();
                if(section === 'messages') loadMessages();
            });
        });

        // CERRAR SESIÓN
        window.logoutAdmin = async () => {
            await db.auth.signOut();
            location.href = 'login.html';
        };

        // FORMULARIO VIP (GUARDAR EN SUPABASE)
        document.getElementById('vipForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button');
            btn.textContent = 'Guardando...'; btn.disabled = true;

            const data = Object.fromEntries(new FormData(form).entries());
            
            const { error } = await db.from('resources').insert([data]);
            
            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('¡Recurso agregado con éxito al Club VIP!');
                form.reset();
            }
            btn.textContent = 'Guardar Recurso'; btn.disabled = false;
        });

        // CARGAR TIENDA
        async function loadProducts() {
            const tbody = document.getElementById('productsTableBody');
            const { data } = await db.from('products').select('*');
            tbody.innerHTML = data?.map(p => `<tr><td>${p.name_es}</td><td>$${p.price}</td></tr>`).join('') || '<tr><td colspan="2">No hay productos</td></tr>';
        }

        // CARGAR PEDIDOS
        async function loadOrders() {
            const tbody = document.getElementById('ordersTableBody');
            const { data } = await db.from('orders').select('*');
            tbody.innerHTML = data?.map(o => `<tr><td>${o.customer_name || 'Cliente'}</td><td>$${o.total}</td></tr>`).join('') || '<tr><td colspan="2">No hay pedidos</td></tr>';
        }

        // CARGAR MENSAJES
        async function loadMessages() {
            const tbody = document.getElementById('messagesTableBody');
            const { data } = await db.from('contact_messages').select('*');
            tbody.innerHTML = data?.map(m => `<tr><td>${m.name}</td><td>${m.subject}</td></tr>`).join('') || '<tr><td colspan="2">No hay mensajes</td></tr>';
        }
    </script>
</body>
</html>
